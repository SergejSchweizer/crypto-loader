[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-loader"
version = "0.1.0"
description = "Framework for crypto market data ingestion"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.5.1",
  "pandas>=3.0.3",
  "polars>=1.42.1",
  "duckdb>=1.5.4",
  "matplotlib>=3.11.0",
  "pyarrow>=25.0.0",
  "PyYAML>=6.0.3",
  "pydantic>=2.13.4",
  "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.13",
  "mypy>=2.2",
  "pre-commit>=4.6",
  "pyright>=1.1.411",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "pytest-xdist>=3.8",
  "ruff>=0.15",
  "ty>=0.0.58",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "application*",
  "ingestion*",
  "api*",
  "infra*",
]
exclude = ["tests*", "notebooks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q -n logical --maxprocesses=4 --dist=loadscope --cov=application --cov=ingestion --cov=api --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
mypy_path = "."
exclude = ["notebooks/", "tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["api", "application", "ingestion", "scripts"]
exclude = ["tests", "notebooks", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ty.src]
include = ["api", "application", "ingestion", "scripts"]

[tool.ty.rules]
redundant-cast = "ignore"
