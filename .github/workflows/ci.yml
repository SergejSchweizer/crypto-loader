name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_SHARD_COUNT: 4

jobs:
  pr-lint-quality:
    name: pr-lint-quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Import architecture checks
        run: uv run lint-imports --config .importlinter

      - name: Validate config schema
        run: uv run python scripts/validate_config_with_pydantic.py --config config.example.yaml

      - name: Validate README inventory
        run: uv run python scripts/validate_readme_inventory.py

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/validate_conventional_commit.py --title "$PR_TITLE"

  pr-typing-quality:
    name: pr-typing-quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Mypy
        run: uv run mypy .

      - name: Pyright
        run: uv run pyright --level error

      - name: Ty
        run: uv run ty check .

  pr-unit-tests:
    name: pr-unit-tests-${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Unit test shard
        run: >
          uv run --extra dev python scripts/pytest_shard.py
          --suite unit
          --shard-index ${{ matrix.shard }}
          --shard-count ${PYTEST_SHARD_COUNT}
          --
          -o addopts= -q -n logical --maxprocesses=4 --dist=loadscope --no-cov

  pr-integration-tests:
    name: pr-integration-tests-${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crypto_loader_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_loader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres-test-only@127.0.0.1:5432/crypto_loader_test
      TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres-test-only@127.0.0.1:5432/crypto_loader_test
      TEST_POSTGRES_RUNTIME_DSN: postgresql://crypto-loader:crypto-runtime-test-only@127.0.0.1:5432/crypto_loader_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify PostgreSQL readiness
        run: >
          uv run python -c
          "import os, psycopg;
          connection = psycopg.connect(os.environ['TEST_POSTGRES_DSN'], connect_timeout=5);
          connection.execute('SELECT 1').fetchone();
          connection.close()"

      - name: Provision isolated PostgreSQL runtime role
        run: uv run python scripts/provision_ci_postgres.py

      - name: Integration test shard
        run: >
          uv run --extra dev python scripts/pytest_shard.py
          --suite integration
          --shard-index ${{ matrix.shard }}
          --shard-count ${PYTEST_SHARD_COUNT}
          --
          -o addopts= -q -n logical --maxprocesses=4 --dist=loadscope --no-cov

  pr-coverage-90:
    name: pr-coverage-90
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crypto_loader_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_loader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres-test-only@127.0.0.1:5432/crypto_loader_test
      TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres-test-only@127.0.0.1:5432/crypto_loader_test
      TEST_POSTGRES_RUNTIME_DSN: postgresql://crypto-loader:crypto-runtime-test-only@127.0.0.1:5432/crypto_loader_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify PostgreSQL readiness
        run: >
          uv run python -c
          "import os, psycopg;
          connection = psycopg.connect(os.environ['TEST_POSTGRES_DSN'], connect_timeout=5);
          connection.execute('SELECT 1').fetchone();
          connection.close()"

      - name: Provision isolated PostgreSQL runtime role
        run: uv run python scripts/provision_ci_postgres.py

      - name: Full test suite with 90 percent coverage gate
        run: uv run pytest --cov-fail-under=90 --cov-report=term-missing

  pr-quality:
    name: pr-quality
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - pr-lint-quality
      - pr-typing-quality
      - pr-unit-tests
      - pr-integration-tests
      - pr-coverage-90

    steps:
      - name: Verify PR quality gates
        run: |
          if [[ "${{ needs.pr-lint-quality.result }}" != "success" ]]; then
            echo "pr-lint-quality result: ${{ needs.pr-lint-quality.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.pr-typing-quality.result }}" != "success" ]]; then
            echo "pr-typing-quality result: ${{ needs.pr-typing-quality.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.pr-unit-tests.result }}" != "success" ]]; then
            echo "pr-unit-tests result: ${{ needs.pr-unit-tests.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.pr-integration-tests.result }}" != "success" ]]; then
            echo "pr-integration-tests result: ${{ needs.pr-integration-tests.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.pr-coverage-90.result }}" != "success" ]]; then
            echo "pr-coverage-90 result: ${{ needs.pr-coverage-90.result }}" >&2
            exit 1
          fi
          echo "pr-quality passed: lint, typing, unit, integration, and 90 percent coverage gates succeeded"

  main-lint-quality:
    name: main-lint-quality
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Import architecture checks
        run: uv run lint-imports --config .importlinter

      - name: Validate config schema
        run: uv run python scripts/validate_config_with_pydantic.py --config config.example.yaml

      - name: Validate README inventory
        run: uv run python scripts/validate_readme_inventory.py

      - name: Validate latest commit title
        run: uv run python scripts/validate_conventional_commit.py --latest

  main-typing-quality:
    name: main-typing-quality
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Mypy
        run: uv run mypy .

      - name: Pyright
        run: uv run pyright --level error

      - name: Ty
        run: uv run ty check .

  main-unit-tests:
    name: main-unit-tests-${{ matrix.shard }}
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Unit test shard with coverage
        run: >
          uv run --extra dev python scripts/pytest_shard.py
          --suite unit
          --shard-index ${{ matrix.shard }}
          --shard-count ${PYTEST_SHARD_COUNT}
          --
          -o addopts= -q -n logical --maxprocesses=4 --dist=loadscope
          --cov=application --cov=ingestion --cov=api --cov-report=

      - name: Prepare coverage artifact
        run: |
          mkdir -p coverage-artifacts
          cp .coverage coverage-artifacts/.coverage.unit.${{ matrix.shard }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: coverage-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  main-integration-tests:
    name: main-integration-tests-${{ matrix.shard }}
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crypto_loader_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_loader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres-test-only@127.0.0.1:5432/crypto_loader_test
      TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres-test-only@127.0.0.1:5432/crypto_loader_test
      TEST_POSTGRES_RUNTIME_DSN: postgresql://crypto-loader:crypto-runtime-test-only@127.0.0.1:5432/crypto_loader_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify PostgreSQL readiness
        run: >
          uv run python -c
          "import os, psycopg;
          connection = psycopg.connect(os.environ['TEST_POSTGRES_DSN'], connect_timeout=5);
          connection.execute('SELECT 1').fetchone();
          connection.close()"

      - name: Provision isolated PostgreSQL runtime role
        run: uv run python scripts/provision_ci_postgres.py

      - name: Integration test shard with coverage
        run: >
          uv run --extra dev python scripts/pytest_shard.py
          --suite integration
          --shard-index ${{ matrix.shard }}
          --shard-count ${PYTEST_SHARD_COUNT}
          --
          -o addopts= -q -n logical --maxprocesses=4 --dist=loadscope
          --cov=application --cov=ingestion --cov=api --cov-report=

      - name: Prepare coverage artifact
        run: |
          mkdir -p coverage-artifacts
          cp .coverage coverage-artifacts/.coverage.integration.${{ matrix.shard }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: coverage-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  main-quality:
    name: main-quality
    if: always() && (github.event_name == 'push' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    needs:
      - main-lint-quality
      - main-typing-quality
      - main-unit-tests
      - main-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify main quality dependencies
        run: |
          if [[ "${{ needs.main-lint-quality.result }}" != "success" ]]; then
            echo "main-lint-quality result: ${{ needs.main-lint-quality.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.main-typing-quality.result }}" != "success" ]]; then
            echo "main-typing-quality result: ${{ needs.main-typing-quality.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.main-unit-tests.result }}" != "success" ]]; then
            echo "main-unit-tests result: ${{ needs.main-unit-tests.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.main-integration-tests.result }}" != "success" ]]; then
            echo "main-integration-tests result: ${{ needs.main-integration-tests.result }}" >&2
            exit 1
          fi

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-shards
          merge-multiple: true

      - name: Coverage report
        run: |
          uv run coverage combine coverage-shards
          uv run coverage report
