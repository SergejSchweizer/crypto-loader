env:
  DEPTH_SYNC_LOG_DIR: .logs
  DEPTH_FETCH_CONCURRENCY: 6
  POLARS_MAX_THREADS: 4
  DEPTH_DERIBIT_PERP_TRADES_PAGE_SIZE: 1000
  DEPTH_DERIBIT_OPTIONS_TRADES_PAGE_SIZE: 1000
  DEPTH_DERIBIT_PERP_TRADES_INTER_REQUEST_SLEEP_S: 0.02
  DEPTH_DERIBIT_OPTIONS_TRADES_INTER_REQUEST_SLEEP_S: 0.02
  DEPTH_PERP_TRADES_WINDOW_MINUTES: 60
  PGHOST: 10.10.1.3
  PGPORT: 54321
  PGUSER: crypto-loader
  PGDATABASE: postgres
  PGPASSWORD: "<set-in-local-config.yaml>"
  PGSTATEMENT_TIMEOUT_MS: 3600000
  PGIDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: 3600000
  PGSYNC_MAX_WORKERS: 2
export-descriptive-stats:
  lake_root: lake/bronze
  output_csv: docs/tables/descriptive_stats.csv
  start_time: "2026-01-01T00:00:00+00:00"
  end_time: "2026-01-31T23:59:59+00:00"
  exchanges: [deribit]
  symbols: [BTC, ETH, SOL]
  timeframes: [1m]
  instrument_types: [spot_ohlcv, perp]

bronze-build:
  exchange: deribit
  dataset: [spot_ohlcv, perps_ohlcv, open_interest, funding, perps_trades, options_trades, volatility_index_data]
  symbol_start_dates:
    - BTC=2018-08-14
    - ETH=2019-03-14
    - SOL=2022-03-15
  symbols: [BTC, ETH, SOL]
  save_parquet_lake: true
  no_json_output: true

medallion-pipeline:
  execution_order: [bronze, silver, gold]
  postgres-sync:
    publication_result: .run/gold-publication-result.json
    serving_deprecation_policy: retain
  reuse-existing-inputs:
    enabled: false
    max_age_seconds: 86400
    bronze_root: lake/bronze
    silver_root: lake/silver
  bronze:
    enabled: true
    command: bronze-build
    cli_args:
      - --exchanges
      - deribit
      - --dataset
      - spot_ohlcv
      - perps_ohlcv
      - open_interest
      - funding
      - perps_trades
      - options_trades
      - volatility_index_data
      - --symbols
      - BTC
      - ETH
      - SOL
      - --save-parquet-lake
      - --tail-delta-only
      - --no-json-output
  silver:
    enabled: true
    command: silver-build
    cli_args:
      - --dataset
      - spot_ohlcv
      - perps_ohlcv
      - funding
      - open_interest
      - perps_trades
      - options_trades
      - volatility_index_data
      - volatility_index_snapshot_1m
      - realized_volatility
      - iv_rv
      - historical_volatility
      - historical_prediction
      - --manifest
      - --maxprocesses
      - "1"
      - --no-json-output
  gold:
    enabled: true
    command: gold-build
    cli_args:
      # Keep scheduled Gold builds limited to the canonical and extended history families.
      - --exclude-dataset-id
      - gold.history.extended_full.m1
      - gold.live.extended.h1
      - gold.live.extended.m1
      - gold.live.extended.m30
      - gold.live.extended.m5
      - gold.live.full.h1
      - gold.live.full.m1
      - gold.live.full.m30
      - gold.live.full.m5
      - --manifest
      - --plot
      - --maxprocesses
      - "4"
      - --no-json-output
